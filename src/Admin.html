<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include_('Styles') ?>
  <style>
    .wrap { max-width: 960px; margin: 0 auto; padding: 40px 16px 72px; }
    header { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
    header .h { flex: 1 1 auto; }
    header h1 { font-family: var(--mincho); font-weight: 600; font-size: 26px; letter-spacing: .12em; margin: 4px 0 0; line-height: 1.4; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
    h2 { font-family: var(--mincho); font-weight: 600; font-size: 17px; letter-spacing: .1em; margin: 0 0 16px; }
    .drop {
      border: 2px dashed var(--line); border-radius: var(--radius); padding: 32px 16px;
      text-align: center; cursor: pointer; transition: .15s; color: var(--ink-2);
    }
    .drop:hover, .drop.over { border-color: var(--brass); background: rgba(168,133,74,.05); color: var(--ink); }
    .drop strong { color: var(--ink); display: block; font-family: var(--mincho); font-weight: 600; font-size: 16px; letter-spacing: .06em; margin-bottom: 4px; }
    .form { display: grid; grid-template-columns: 140px 1fr; gap: 20px; margin-top: 4px; }
    .form[hidden] { display: none; }
    .thumb {
      width: 100%; aspect-ratio: 1 / 1.414; background: #efe9de center / contain no-repeat;
      border-radius: 1px 3px 3px 1px; box-shadow: 0 1px 2px rgba(40,25,10,.2), 4px 6px 12px rgba(40,25,10,.12);
    }
    .fields { display: grid; gap: 14px; align-content: start; }
    label.f { display: grid; gap: 4px; font-size: 14px; color: var(--ink-2); }
    .text {
      width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 4px;
      background: #fff; color: var(--ink); font-size: 15px;
    }
    .opts { display: flex; gap: 8px 20px; flex-wrap: wrap; font-size: 14px; }
    .opts label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
    .seg label { padding: 7px 16px; }
    .seg label { padding: 7px 14px; cursor: pointer; font-size: 14px; }
    .seg input { position: absolute; opacity: 0; pointer-events: none; }
    .seg label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
    .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .status { font-size: 14px; color: var(--ink-2); }
    .list { margin-top: 28px; }
    .listHead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
    .item {
      display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: start;
      padding: 14px 0; border-top: 1px solid var(--line);
    }
    .item:first-of-type { border-top: 0; }
    .item .thumb { width: 64px; }
    .item .text { height: 36px; font-family: var(--mincho); font-weight: 600; letter-spacing: .04em; }
    .item .meta { font-size: 13px; color: var(--ink-2); margin: 6px 0 8px; }
    .item .opts { font-size: 14px; }
    .item select { height: 30px; border: 1px solid var(--line); border-radius: 4px; background: #fff; padding: 0 6px; }
    .item .btns { display: flex; flex-direction: column; gap: 6px; }
    .empty { color: var(--ink-2); padding: 24px 0; text-align: center; }
    @media (max-width: 600px) {
      .form { grid-template-columns: 1fr; }
      .form .thumb { width: 120px; }
      .item { grid-template-columns: 52px 1fr; }
      .item .thumb { width: 52px; }
      .item .btns { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; }
    }
  </style>
</head>
<body class="paper">
  <div class="wrap">
    <header>
      <div class="h"><div class="eyebrow">Library Admin</div><h1>電子ブックの管理</h1></div>
      <a id="shelfLink" class="btn">本棚を見る</a>
    </header>

    <section class="card">
      <h2>PDFから電子ブックを作る</h2>
      <div id="drop" class="drop" tabindex="0" role="button" aria-label="PDFを選ぶ">
        <strong>PDFをここにドラッグ、またはクリックして選択</strong>
        <span id="limit"></span>
      </div>
      <input id="file" type="file" accept="application/pdf,.pdf" hidden>

      <div id="form" class="form" hidden>
        <div id="newThumb" class="thumb"></div>
        <div class="fields">
          <label class="f">タイトル<input id="newTitle" class="text" maxlength="200"></label>
          <div class="f">
            <span class="muted" style="font-size:14px">ページの開き方</span>
            <div class="seg">
              <label><input type="radio" name="dir" value="ltr" checked>左開き（横書き）</label>
              <label><input type="radio" name="dir" value="rtl">右開き（縦書き）</label>
            </div>
          </div>
          <div class="opts">
            <label><input id="newListed" type="checkbox" checked>本棚に表示する</label>
            <label><input id="newDl" type="checkbox">閲覧者のPDF保存を許可</label>
          </div>
          <div class="actions">
            <button id="uploadBtn" class="btn primary">電子ブックを作成</button>
            <button id="cancelBtn" class="btn">やめる</button>
            <span id="status" class="status"></span>
          </div>
        </div>
      </div>
    </section>

    <section class="card list">
      <div class="listHead"><h2 style="margin:0">登録済みのブック</h2><span id="count" class="muted"></span></div>
      <div id="items"><div class="empty">読み込み中…</div></div>
    </section>
  </div>

  <?!= include_('Common') ?>
  <script>
    const BOOT = <?!= boot ?>;
    const KEY = BOOT.key;
    let picked = null;   // { file, pdf, pageCount, cover }

    document.getElementById('shelfLink').href = BOOT.execUrl;
    document.getElementById('limit').textContent = '1ファイル ' + BOOT.maxUploadMb + 'MB まで';

    // ───────── PDFの選択 ─────────

    const drop = document.getElementById('drop');
    const fileInput = document.getElementById('file');
    drop.addEventListener('click', () => fileInput.click());
    drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', e => {
      e.preventDefault();
      drop.classList.remove('over');
      if (e.dataTransfer.files[0]) pick(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => { if (fileInput.files[0]) pick(fileInput.files[0]); });

    async function pick(file) {
      if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') return toast('PDFファイルを選んでください', true);
      if (file.size > BOOT.maxUploadMb * 1024 * 1024) {
        return toast(formatSize(file.size) + ' あります。' + BOOT.maxUploadMb + 'MB 以下に圧縮してから登録してください', true);
      }
      setStatus('PDFを確認中…');
      drop.hidden = true;
      document.getElementById('form').hidden = false;
      document.getElementById('newTitle').value = file.name.replace(/\.pdf$/i, '');
      document.getElementById('newThumb').style.backgroundImage = '';
      document.getElementById('uploadBtn').disabled = true;
      try {
        const lib = await loadPdfjs();
        const buf = await file.arrayBuffer();
        const pdf = await lib.getDocument({ data: new Uint8Array(buf), ...PDF_OPTS }).promise;
        const cover = await makeCover(pdf);
        picked = { file, pageCount: pdf.numPages, cover };
        document.getElementById('newThumb').style.backgroundImage = 'url("' + cover + '")';
        setStatus(pdf.numPages + 'ページ・' + formatSize(file.size));
        document.getElementById('uploadBtn').disabled = false;
        pdf.destroy();
      } catch (err) {
        resetForm();
        toast('PDFを読み込めませんでした：' + err.message, true);
      }
    }

    /** 1ページ目を小さなJPEGにする。シートのセルに入れるので文字数上限に収まるまで縮める */
    async function makeCover(pdf) {
      const page = await pdf.getPage(1);
      const vp1 = page.getViewport({ scale: 1 });
      for (const [w, q] of [[360, .8], [320, .7], [280, .6], [240, .55], [200, .5], [160, .5]]) {
        const vp = page.getViewport({ scale: w / vp1.width });
        const c = document.createElement('canvas');
        c.width = Math.floor(vp.width);
        c.height = Math.floor(vp.height);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, c.width, c.height);
        await page.render({ canvasContext: ctx, viewport: vp }).promise;
        const url = c.toDataURL('image/jpeg', q);
        if (url.length <= BOOT.coverMaxChars) return url;
      }
      return '';
    }

    function readBase64(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(String(r.result).split(',')[1]);
        r.onerror = () => reject(r.error);
        r.readAsDataURL(file);
      });
    }

    function setStatus(t) { document.getElementById('status').textContent = t; }

    function resetForm() {
      picked = null;
      fileInput.value = '';
      drop.hidden = false;
      document.getElementById('form').hidden = true;
      setStatus('');
    }

    document.getElementById('cancelBtn').addEventListener('click', resetForm);

    document.getElementById('uploadBtn').addEventListener('click', async () => {
      if (!picked) return;
      const btn = document.getElementById('uploadBtn');
      const cancel = document.getElementById('cancelBtn');
      btn.disabled = cancel.disabled = true;
      setStatus('アップロード中…（大きいPDFは1分ほどかかります）');
      try {
        const base64 = await readBase64(picked.file);
        await run('adminUpload', KEY, {
          title: document.getElementById('newTitle').value.trim(),
          fileName: picked.file.name,
          base64,
          pageCount: picked.pageCount,
          direction: document.querySelector('input[name=dir]:checked').value,
          listed: document.getElementById('newListed').checked,
          allowDownload: document.getElementById('newDl').checked,
          cover: picked.cover,
        });
        toast('電子ブックを作成しました');
        resetForm();
        await load();
      } catch (err) {
        setStatus('');
        toast('登録できませんでした：' + err.message, true);
      } finally {
        btn.disabled = cancel.disabled = false;
      }
    });

    // ───────── 一覧 ─────────

    let books = [];

    async function load() {
      try {
        books = await run('adminList', KEY);
        draw();
      } catch (err) {
        document.getElementById('items').innerHTML = '<div class="empty">読み込めませんでした：' + escapeHtml(err.message) + '</div>';
      }
    }

    function draw() {
      document.getElementById('count').textContent = books.length ? books.length + '冊' : '';
      const box = document.getElementById('items');
      if (!books.length) {
        box.innerHTML = '<div class="empty">まだありません。上からPDFを登録してください。</div>';
        return;
      }
      box.innerHTML = books.map(b => `
        <div class="item" data-id="${escapeHtml(b.id)}">
          <div class="thumb" ${b.cover ? `data-cover="${escapeHtml(b.cover)}"` : ''}></div>
          <div>
            <input class="text" data-f="title" value="${escapeHtml(b.title)}" maxlength="200" aria-label="タイトル">
            <div class="meta">${b.pageCount}ページ・${formatSize(b.size)}・閲覧 ${b.views}回・${formatDate(b.createdAt)} 登録</div>
            <div class="opts">
              <select data-f="direction" aria-label="開き方">
                <option value="ltr" ${b.direction !== 'rtl' ? 'selected' : ''}>左開き</option>
                <option value="rtl" ${b.direction === 'rtl' ? 'selected' : ''}>右開き</option>
              </select>
              <label><input type="checkbox" data-f="listed" ${b.listed ? 'checked' : ''}>本棚に表示</label>
              <label><input type="checkbox" data-f="allowDownload" ${b.allowDownload ? 'checked' : ''}>PDF保存を許可</label>
            </div>
          </div>
          <div class="btns">
            <a class="btn small" href="${escapeHtml(b.url)}">開く</a>
            <button class="btn small" data-act="copy">URLをコピー</button>
            <button class="btn small danger" data-act="delete">削除</button>
          </div>
        </div>`).join('');
      box.querySelectorAll('[data-cover]').forEach(el => { el.style.backgroundImage = 'url("' + el.dataset.cover + '")'; });
    }

    const items = document.getElementById('items');

    // 変更したらその場で保存
    items.addEventListener('change', async e => {
      const el = e.target;
      const f = el.dataset.f;
      if (!f) return;
      const id = el.closest('.item').dataset.id;
      const value = el.type === 'checkbox' ? el.checked : el.value.trim();
      if (f === 'title' && !value) { el.value = books.find(b => b.id === id).title; return; }
      try {
        await run('adminUpdate', KEY, id, { [f]: value });
        const b = books.find(b => b.id === id);
        if (b) b[f] = value;
        toast('保存しました');
      } catch (err) {
        toast('保存できませんでした：' + err.message, true);
        load();
      }
    });
    items.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target.dataset.f === 'title') e.target.blur();
    });

    items.addEventListener('click', async e => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const id = btn.closest('.item').dataset.id;
      const b = books.find(b => b.id === id);
      if (btn.dataset.act === 'copy') {
        toast(await copyText(b.url) ? 'URLをコピーしました' : b.url);
      }
      if (btn.dataset.act === 'delete') {
        if (!confirm('「' + b.title + '」を削除しますか？\n共有したURLは開けなくなります。PDFはドライブのゴミ箱に移ります。')) return;
        btn.disabled = true;
        try {
          await run('adminDelete', KEY, id);
          books = books.filter(x => x.id !== id);
          draw();
          toast('削除しました');
        } catch (err) {
          btn.disabled = false;
          toast('削除できませんでした：' + err.message, true);
        }
      }
    });

    load();
  </script>
</body>
</html>
