<head><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>電子ブック本棚 デモ</title><script>window.__DEMO_BOOKS__ = [{"id": "company-profile", "title": "会社案内 2026", "file": "samples/01_company-profile.pdf", "fileName": "01_company-profile.pdf", "pageCount": 8, "direction": "ltr", "allowDownload": true, "cover": "covers/company-profile.jpg", "createdAt": "2026-10-07T00:00:00Z"}, {"id": "cafe-menu", "title": "喫茶ことり メニュー", "file": "samples/02_cafe-menu.pdf", "fileName": "02_cafe-menu.pdf", "pageCount": 8, "direction": "ltr", "allowDownload": true, "cover": "covers/cafe-menu.jpg", "createdAt": "2026-10-07T00:00:00Z"}, {"id": "vertical-rtl", "title": "季節のことば", "file": "samples/03_vertical-rtl.pdf", "fileName": "03_vertical-rtl.pdf", "pageCount": 8, "direction": "rtl", "allowDownload": true, "cover": "covers/vertical-rtl.jpg", "createdAt": "2026-10-07T00:00:00Z"}, {"id": "town-guide", "title": "港町・汐見を歩く", "file": "samples/04_town-guide.pdf", "fileName": "04_town-guide.pdf", "pageCount": 8, "direction": "ltr", "allowDownload": true, "cover": "covers/town-guide.jpg", "createdAt": "2026-10-07T00:00:00Z"}];</script><script>// GitHub Pages のデモ用：GAS の google.script.run / history を、静的ファイルで置き換える。
// demo/build.py がビルド時に BOOKS を埋め込み、各ページの <head> 先頭に差し込む。
(function () {
  const BOOKS = window.__DEMO_BOOKS__;
  const find = id => BOOKS.find(b => b.id === id);

  const api = {
    getShelf() {
      return BOOKS.map(b => ({ id: b.id, title: b.title, pageCount: b.pageCount, cover: b.cover, createdAt: b.createdAt }));
    },
    // GAS 版は4MBずつ返すが、デモは chunkCount=1 にしてファイル全体を一度に返す
    async getPdfChunk(id) {
      const b = find(id);
      if (!b) throw new Error('ブックが見つかりません');
      const blob = await fetch(b.file).then(r => {
        if (!r.ok) throw new Error('PDFを取得できませんでした（' + r.status + '）');
        return r.blob();
      });
      return new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onload = () => resolve(String(fr.result).split(',')[1]);
        fr.onerror = () => reject(fr.error);
        fr.readAsDataURL(blob);
      });
    },
  };

  function makeRunner(ok, ng) {
    return new Proxy({}, {
      get(_, fn) {
        if (fn === 'withSuccessHandler') return h => makeRunner(h, ng);
        if (fn === 'withFailureHandler') return h => makeRunner(ok, h);
        return (...args) => {
          if (!api[fn]) { if (ng) ng(new Error('デモ版では使えない機能です')); return; }
          Promise.resolve().then(() => api[fn](...args)).then(r => ok && ok(r), e => ng && ng(e));
        };
      },
    });
  }

  window.google = {
    script: {
      run: makeRunner(null, null),
      history: {
        replace(_, params) {
          try { history.replaceState(null, '', '?' + new URLSearchParams(params)); } catch (e) { /* 失敗しても閲覧には影響しない */ }
        },
      },
    },
  };

  /** viewer.html の BOOT を URL から組み立てる（GAS 版では doGet が行う処理） */
  window.__demoViewerBoot = function () {
    const q = new URLSearchParams(location.search);
    const b = find(q.get('book'));
    if (!b) {
      location.replace('./');
      throw new Error('book not found');
    }
    return {
      execUrl: location.origin + location.pathname,   // 共有用URL（viewer.html?book=…）
      homeUrl: './',
      startPage: Number(q.get('p')) || 1,
      fromShelf: q.get('open') === '1',
      book: {
        id: b.id, title: b.title, fileName: b.fileName, size: 0, pageCount: b.pageCount,
        direction: b.direction, allowDownload: b.allowDownload, cover: b.cover,
        chunkSize: 0, chunkCount: 1,
      },
    };
  };

  // 本棚の下に「デモ版」の注記を出す
  window.addEventListener('DOMContentLoaded', () => {
    const footer = document.querySelector('body.paper footer');
    if (!footer) return;

    footer.appendChild(note);
  });
})();

<script>
  const PDFJS_WORKER_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  // 日本語PDF（フォント非埋め込み）を正しく描くために CMap と標準フォントを読ませる
  const PDF_OPTS = {
    cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',
    cMapPacked: true,
    standardFontDataUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/',
  };

  /** google.script.run を Promise で呼ぶ */
  function run(fn, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => reject(err instanceof Error ? err : new Error(String(err && err.message || err))))[fn](...args);
    });
  }

  /**
   * GASの画面は別オリジンのiframeで動くため、CDNのワーカーを new Worker() で直接は起動できない。
   * 中身を取ってきて Blob URL にして渡す。失敗しても pdf.js はメインスレッドで動く。
   */
  let pdfjsReady = null;
  function loadPdfjs() {
    if (!pdfjsReady) {
      pdfjsReady = fetch(PDFJS_WORKER_URL)
        .then(r => r.text())
        .then(src => {
          pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
        })
        .catch(() => { pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_URL; })
        .then(() => pdfjsLib);
    }
    return pdfjsReady;
  }

  function toast(msg, isError) {
    let el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast';
      el.setAttribute('role', 'status');
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.toggle('error', !!isError);
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), isError ? 5000 : 2200);
  }

  /** iframe内では navigator.clipboard が塞がれることがあるので execCommand に逃がす */
  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
      ta.remove();
      return ok;
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function formatSize(bytes) {
    if (bytes >= 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    return Math.max(1, Math.round(bytes / 1024)) + ' KB';
  }

  function formatDate(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
  }
</script>

  <script>
    const BOOT = {"execUrl": "viewer.html", "appTitle": "電子ブック本棚 デモ", "adminUrl": ""};
    const NEW_DAYS = 14;
    let books = [];

    document.getElementById('appTitle').textContent = BOOT.appTitle;
    if (BOOT.adminUrl) {

      a.hidden = false;

    function columns() {
      const w = document.querySelector('main').clientWidth - 32;
      if (w < 520) return 2;
      return Math.max(3, Math.min(6, Math.floor(w / 180)));
    }

    function bookUrl(b) {
      return BOOT.execUrl + '?book=' + encodeURIComponent(b.id) + '&open=1';
    }

    function isNew(b) {
      const d = new Date(b.createdAt);
      return !isNaN(d) && (Date.now() - d) / 86400000 < NEW_DAYS;
    }

    function shelfHtml(row, cols) {
      const slots = row.map((b, i) => `
        <div class="slot" style="grid-column:${i + 1}">
          <a class="book" href="${bookUrl(b)}" tabindex="-1" aria-hidden="true">

      const labels = row.map((b, i) => `
        <div class="label" style="grid-column:${i + 1}">
          <a href="${bookUrl(b)}"><div class="t">${escapeHtml(b.title)}</div></a>
          <div class="m">${b.pageCount}ページ　${formatDot(b.createdAt)}</div>
        </div>`).join('');
      return `<section class="shelf" style="--cols:${cols}">${slots}<div class="plank"></div>${labels}</section>`;
    }

    function formatDot(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return '';
      return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
    }

    function draw() {
      const q = document.getElementById('q').value.trim().toLowerCase();
      const list = document.getElementById('list');
      const shown = books.filter(b => !q || b.title.toLowerCase().includes(q));
      document.getElementById('count').textContent = books.length ? '全 ' + books.length + ' 冊' : '';
      if (!books.length) {
        list.className = 'empty';
        list.textContent = 'まだ本が並んでいません';
        return;
      }
      if (!shown.length) {
        list.className = 'empty';
        list.textContent = '「' + q + '」に一致する本はありません';
        return;
      }
      const cols = columns();
      let html = '';
      for (let i = 0; i < shown.length; i += cols) html += shelfHtml(shown.slice(i, i + cols), cols);
      list.className = '';
      list.innerHTML = html;
      // dataURL は属性に直接書かず JS で入れる
      list.querySelectorAll('img[data-src]').forEach(img => { img.src = img.dataset.src; });
    }

    document.getElementById('q').addEventListener('input', draw);
    let lastCols = 0;
    window.addEventListener('resize', () => {
      const c = columns();
      if (c !== lastCols && books.length) { lastCols = c; draw(); }
    });

    // ───────── 本を開く演出 ─────────
    // リンク移動はそのまま進め、次の画面が届くまでの間に表紙を中央へ運ぶ。
    // 閲覧画面の読み込み中の表紙と同じ位置・大きさに着地させてつなげる。
    document.getElementById('list').addEventListener('click', e => {
      const a = e.target.closest('a[href]');
      if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const slot = a.closest('.slot') || document.querySelector(`.slot [href="${CSS.escape(a.getAttribute('href'))}"]`)?.closest('.slot');
      const src = slot && slot.querySelector('img');
      if (!src || !src.naturalWidth) return;
      playOpening(src);
    });

    function playOpening(src) {
      const r = src.getBoundingClientRect();
      const aspect = src.naturalWidth / src.naturalHeight;
      const h = Math.min(window.innerHeight * 0.62, 560, (window.innerWidth - 48) / aspect);
      const w = h * aspect;
      const left = (window.innerWidth - w) / 2;
      const top = (window.innerHeight - h) / 2;

      const ov = document.createElement('div');
      ov.className = 'opening';
      ov.innerHTML = '<div class="room"></div>';
      const img = new Image();
      img.src = src.src;
      Object.assign(img.style, { left: left + 'px', top: top + 'px', width: w + 'px', height: h + 'px' });
      ov.appendChild(img);
      document.body.appendChild(ov);
      src.closest('.book').style.visibility = 'hidden';

      const s = r.width / w;
      img.animate([
        { transform: `translate(${r.left - left}px, ${r.top - top}px) scale(${s})`, boxShadow: '0 4px 10px rgba(0,0,0,.2)' },
        { transform: `translate(${(r.left - left) * .35}px, ${(r.top - top) * .35 - 20}px) scale(${(s + 1) / 2}) rotateY(-10deg)`, offset: .55 },
        { transform: 'none', boxShadow: '0 30px 60px rgba(0,0,0,.45)' },
      ], { duration: 900, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'both' });
      requestAnimationFrame(() => ov.classList.add('on'));

      // 戻るボタンで戻ってきたとき・移動できなかったときに元へ戻す
      const restore = () => { ov.remove(); src.closest('.book').style.visibility = ''; };
      setTimeout(restore, 15000);
      window.addEventListener('pageshow', restore, { once: true });
    }

    run('getShelf')
      .then(res => { books = res; lastCols = columns(); draw(); })
      .catch(err => {
        const list = document.getElementById('list');
        list.className = 'empty';
        list.textContent = '読み込めませんでした：' + err.message;
      });
  </script>
</body>
</html>
