<head><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>電子ブック本棚 デモ</title><script>window.__DEMO_BOOKS__ = [{"id": "company-profile", "title": "会社案内 2026", "file": "samples/01_company-profile.pdf", "fileName": "01_company-profile.pdf", "pageCount": 8, "direction": "ltr", "allowDownload": true, "cover": "covers/company-profile.jpg", "createdAt": "2026-10-07T00:00:00Z"}, {"id": "cafe-menu", "title": "喫茶ことり メニュー", "file": "samples/02_cafe-menu.pdf", "fileName": "02_cafe-menu.pdf", "pageCount": 8, "direction": "ltr", "allowDownload": true, "cover": "covers/cafe-menu.jpg", "createdAt": "2026-10-07T00:00:00Z"}, {"id": "vertical-rtl", "title": "季節のことば", "file": "samples/03_vertical-rtl.pdf", "fileName": "03_vertical-rtl.pdf", "pageCount": 8, "direction": "rtl", "allowDownload": true, "cover": "covers/vertical-rtl.jpg", "createdAt": "2026-10-07T00:00:00Z"}, {"id": "town-guide", "title": "港町・汐見を歩く", "file": "samples/04_town-guide.pdf", "fileName": "04_town-guide.pdf", "pageCount": 8, "direction": "ltr", "allowDownload": true, "cover": "covers/town-guide.jpg", "createdAt": "2026-10-07T00:00:00Z"}];</script><script>// GitHub Pages のデモ用：GAS の google.script.run / history を、静的ファイルで置き換える。
// demo/build.py がビルド時に BOOKS を埋め込み、各ページの <head> 先頭に差し込む。
(function () {
  const BOOKS = window.__DEMO_BOOKS__;
  const find = id => BOOKS.find(b => b.id === id);

  const api = {
    getShelf() {
      return BOOKS.map(b => ({ id: b.id, title: b.title, pageCount: b.pageCount, cover: b.cover, createdAt: b.createdAt }));
    },
    // GAS 版は4MBずつ返すが、デモは chunkCount=1 にしてファイル全体を一度に返す
    async getPdfChunk(id) {
      const b = find(id);
      if (!b) throw new Error('ブックが見つかりません');
      const blob = await fetch(b.file).then(r => {
        if (!r.ok) throw new Error('PDFを取得できませんでした（' + r.status + '）');
        return r.blob();
      });
      return new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onload = () => resolve(String(fr.result).split(',')[1]);
        fr.onerror = () => reject(fr.error);
        fr.readAsDataURL(blob);
      });
    },
  };

  function makeRunner(ok, ng) {
    return new Proxy({}, {
      get(_, fn) {
        if (fn === 'withSuccessHandler') return h => makeRunner(h, ng);
        if (fn === 'withFailureHandler') return h => makeRunner(ok, h);
        return (...args) => {
          if (!api[fn]) { if (ng) ng(new Error('デモ版では使えない機能です')); return; }
          Promise.resolve().then(() => api[fn](...args)).then(r => ok && ok(r), e => ng && ng(e));
        };
      },
    });
  }

  window.google = {
    script: {
      run: makeRunner(null, null),
      history: {
        replace(_, params) {
          try { history.replaceState(null, '', '?' + new URLSearchParams(params)); } catch (e) { /* 失敗しても閲覧には影響しない */ }
        },
      },
    },
  };

  /** viewer.html の BOOT を URL から組み立てる（GAS 版では doGet が行う処理） */
  window.__demoViewerBoot = function () {
    const q = new URLSearchParams(location.search);
    const b = find(q.get('book'));
    if (!b) {
      location.replace('./');
      throw new Error('book not found');
    }
    return {
      execUrl: location.origin + location.pathname,   // 共有用URL（viewer.html?book=…）
      homeUrl: './',
      startPage: Number(q.get('p')) || 1,
      fromShelf: q.get('open') === '1',
      book: {
        id: b.id, title: b.title, fileName: b.fileName, size: 0, pageCount: b.pageCount,
        direction: b.direction, allowDownload: b.allowDownload, cover: b.cover,
        chunkSize: 0, chunkCount: 1,
      },
    };
  };

  // 本棚の下に「デモ版」の注記を出す
  window.addEventListener('DOMContentLoaded', () => {
    const footer = document.querySelector('body.paper footer');
    if (!footer) return;
    const note = document.createElement('p');
    note.style.cssText = 'margin:14px 0 0;font-size:13px;color:var(--ink-2);line-height:1.8';
    note.innerHTML = 'これはデモ版です。PDFの登録は、Google Apps Script に設置すると使えます。<br><a href="https://github.com/n-tsukuda/ebook-shelf-gas">GitHub でコードを見る</a>';
    footer.appendChild(note);
  });
})();
</script>

      <h2><span class="eyebrow">Contents</span>ページ一覧</h2>
      <button id="sheetClose" class="icon-btn" aria-label="閉じる"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="sheetBody" class="sheet-body"><div id="thumbs" class="thumbs"></div></div>
  </aside>

  <div id="zoom" class="zoom" hidden>
    <div class="top">
      <div class="zoomTools">
        <button id="zoomOut" class="icon-btn" aria-label="縮小"><svg class="i" viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
        <div id="zoomLevel" class="zoomLevel">100%</div>
        <button id="zoomIn" class="icon-btn" aria-label="拡大"><svg class="i" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
      </div>
      <div></div>
      <button id="zoomClose" class="icon-btn" aria-label="閉じる"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="zoomBody" class="zoomBody"><div id="zoomPages" class="zoomPages"></div></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  const PDFJS_WORKER_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  // 日本語PDF（フォント非埋め込み）を正しく描くために CMap と標準フォントを読ませる
  const PDF_OPTS = {
    cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',
    cMapPacked: true,
    standardFontDataUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/',
  };

  /** google.script.run を Promise で呼ぶ */
  function run(fn, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => reject(err instanceof Error ? err : new Error(String(err && err.message || err))))[fn](...args);
    });
  }

  /**
   * GASの画面は別オリジンのiframeで動くため、CDNのワーカーを new Worker() で直接は起動できない。
   * 中身を取ってきて Blob URL にして渡す。失敗しても pdf.js はメインスレッドで動く。
   */
  let pdfjsReady = null;
  function loadPdfjs() {
    if (!pdfjsReady) {
      pdfjsReady = fetch(PDFJS_WORKER_URL)
        .then(r => r.text())
        .then(src => {
          pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
        })
        .catch(() => { pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_URL; })
        .then(() => pdfjsLib);
    }
    return pdfjsReady;
  }

  function toast(msg, isError) {
    let el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast';
      el.setAttribute('role', 'status');
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.toggle('error', !!isError);
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), isError ? 5000 : 2200);
  }

  /** iframe内では navigator.clipboard が塞がれることがあるので execCommand に逃がす */
  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
      ta.remove();
      return ok;
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function formatSize(bytes) {
    if (bytes >= 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    return Math.max(1, Math.round(bytes / 1024)) + ' KB';
  }

  function formatDate(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
  }
</script>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script>
    const BOOT = window.__demoViewerBoot();
    const META = BOOT.book;
    const RTL = META.direction === 'rtl';
    const MIN_PAGE_W = 300;        // 見開きにするのは本の幅がこの2倍以上あるとき
    const KEEP_RANGE = 10;         // 現在位置からこの枚数より遠いページは画像を捨ててメモリを空ける
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    let pdf = null;
    let pdfBytes = null;           // ダウンロード用に保持（許可されている場合のみ）
    let pf = null;
    let ratio = 1 / 1.414;         // 1ページ目の 幅/高さ
    let order = [];                // 表示順 → 元のページ番号（0は白紙）
    let pageEls = [];
    const rendered = new Map();    // 表示順index → 描画した横幅(px)

    document.title = META.title;
    document.getElementById('title').textContent = META.title;
    document.getElementById('homeLink').href = BOOT.homeUrl || BOOT.execUrl;   // homeUrl は GitHub Pages のデモ用

    // ───────── 読み込み中：本棚から運ばれてきた表紙を同じ位置に置く ─────────

    let loadCover = null;
    if (META.cover) {
      loadCover = new Image();
      loadCover.alt = '';
      loadCover.onload = () => {
        const aspect = loadCover.naturalWidth / loadCover.naturalHeight;
        const h = Math.min(window.innerHeight * 0.62, 560, (window.innerWidth - 48) / aspect);
        const w = h * aspect;
        Object.assign(loadCover.style, { width: w + 'px', height: h + 'px', left: (window.innerWidth - w) / 2 + 'px', top: (window.innerHeight - h) / 2 + 'px' });
      };
      loadCover.src = META.cover;
      document.getElementById('loading').prepend(loadCover);
    } else {
      const sp = document.createElement('div');
      sp.className = 'spinner';
      document.getElementById('loading').prepend(sp);
    }

    // ───────── PDFの取得（分割して並列に取る） ─────────

    async function fetchPdf() {
      const total = META.chunkCount;
      const parts = new Array(total);
      let done = 0, next = 0;
      const setProgress = () => {
        const pct = Math.round(done / total * 100);
        document.getElementById('bar').style.width = pct + '%';
        document.getElementById('loadText').textContent = 'Loading ' + pct + '%';
      };
      setProgress();
      async function worker() {
        while (next < total) {
          const i = next++;
          let b64;
          for (let attempt = 0; ; attempt++) {
            try { b64 = await run('getPdfChunk', META.id, i); break; }
            catch (e) { if (attempt >= 2) throw e; await new Promise(r => setTimeout(r, 800 * (attempt + 1))); }
          }
          const bin = atob(b64);
          const arr = new Uint8Array(bin.length);
          for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
          parts[i] = arr;
          done++;
          setProgress();
        }
      }
      await Promise.all([worker(), worker(), worker()].slice(0, Math.min(3, total)));
      const size = parts.reduce((s, p) => s + p.length, 0);
      const all = new Uint8Array(size);
      let off = 0;
      parts.forEach(p => { all.set(p, off); off += p.length; });
      return all;
    }

    // ───────── ページの並びと見開き ─────────

    /** 右開きはStPageFlipが対応していないので、並びを逆にして最後から開く */
    function buildOrder(n) {
      const pages = [];
      for (let i = 1; i <= n; i++) pages.push(i);
      if (!RTL) return pages;
      if (pages.length % 2 === 1) pages.push(0);   // 見開きの左右を正しく組むため偶数にそろえる
      return pages.reverse();
    }

    /** いま画面に出ている表示順indexの配列（StPageFlipの見開き規則と同じ） */
    function visibleIndexes() {
      const idx = pf.getCurrentPageIndex();
      if (pf.getOrientation() === 'portrait') return [idx];
      if (idx === 0) return [0];
      const start = idx % 2 === 1 ? idx : idx - 1;
      return [start, start + 1].filter(i => i < order.length);
    }

    function visibleOriginalPages() {
      return visibleIndexes().map(i => order[i]).filter(p => p > 0).sort((a, b) => a - b);
    }

    function indexOfOriginal(p) {
      return order.indexOf(p);
    }

    // ───────── 本のサイズ合わせ ─────────

    function fitBook() {
      const stage = document.getElementById('stage');
      const cs = getComputedStyle(stage);
      const w = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const h = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      const spreadW = Math.min(w, h * ratio * 2);
      const landscape = spreadW >= MIN_PAGE_W * 2;
      const bookW = Math.floor(landscape ? spreadW : Math.min(w, h * ratio));
      const el = document.getElementById('book');
      el.style.width = bookW + 'px';
      el.style.maxWidth = bookW + 'px';
      el.style.minWidth = '0';
    }

    // ───────── 描画（見ている付近だけ・1枚ずつ順番に） ─────────
    // canvas ではなく img にする。StPageFlip は1ページ表示でめくるとき要素を cloneNode で複製し、
    // canvas だと中身がコピーされず白紙になるため。

    function targetWidth() {
      const r = pf && pf.getBoundsRect();
      const cssW = r ? r.pageWidth : 600;
      return Math.min(2000, Math.max(700, Math.round(cssW * DPR)));
    }

    let queue = [];
    let rendering = false;

    function scheduleRender() {
      if (!pf) return;
      const vis = visibleIndexes();
      const center = vis[0];
      const want = targetWidth();
      const list = [...vis];
      for (let d = 1; d <= 4; d++) list.push(vis[vis.length - 1] + d, vis[0] - d);
      queue = list.filter(i => i >= 0 && i < order.length && order[i] > 0 && (rendered.get(i) || 0) < want * 0.8);
      rendered.forEach((_, i) => {
        if (Math.abs(i - center) > KEEP_RANGE) {
          const img = pageEls[i].querySelector('img');
          if (img) { URL.revokeObjectURL(img.src); img.remove(); }
          rendered.delete(i);
        }
      });
      pump();
    }

    async function pump() {
      if (rendering) return;
      rendering = true;
      try {
        while (queue.length) {
          const i = queue.shift();
          const want = targetWidth();
          if ((rendered.get(i) || 0) >= want * 0.8) continue;
          await renderPage(i, want);
        }
      } finally {
        rendering = false;
      }
    }

    async function renderPage(i, width) {
      const page = await pdf.getPage(order[i]);
      const vp1 = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: width / vp1.width });
      const canvas = document.createElement('canvas');
      canvas.width = Math.floor(vp.width);
      canvas.height = Math.floor(vp.height);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.9));
      canvas.width = canvas.height = 0;
      const img = new Image();
      img.alt = '';
      img.draggable = false;
      img.src = URL.createObjectURL(blob);
      await img.decode().catch(() => {});
      const old = pageEls[i].querySelector('img');
      if (old) { URL.revokeObjectURL(old.src); old.replaceWith(img); } else pageEls[i].appendChild(img);
      rendered.set(i, width);
    }

    // ───────── 操作 ─────────

    function updateUi() {
      const pages = visibleOriginalPages();
      const n = pdf.numPages;
      const label = document.getElementById('pageLabel');
      label.innerHTML = !pages.length ? '' :
        (pages.length === 1 ? pages[0] : pages[0] + '–' + pages[pages.length - 1]) + ' <small>/ ' + n + '</small>';
      if (pages.length) setSlider(pages[0]);
      document.querySelectorAll('.thumb').forEach(t => t.classList.toggle('current', pages.includes(Number(t.dataset.p))));
      // アドレスバーのURLを ?book=…&p=ページ に更新（そのまま共有すると同じページが開く）
      clearTimeout(updateUi._t);
      updateUi._t = setTimeout(() => {
        try { google.script.history.replace(null, { book: META.id, p: String(pages[0] || 1) }); } catch (e) { /* 失敗しても閲覧には影響しない */ }
      }, 400);
    }

    function setSlider(p) {
      const s = document.getElementById('slider');
      s.value = p;
      const pct = pdf.numPages > 1 ? (p - 1) / (pdf.numPages - 1) * 100 : 100;
      s.style.setProperty('--pct', pct + '%');
    }

    function goToOriginal(p) {
      const i = indexOfOriginal(p);
      if (i < 0) return;
      const vis = visibleIndexes();
      if (vis.includes(i)) return;
      const near = Math.abs(i - vis[0]) <= 2;
      if (near && !reducedMotion) pf.flip(i); else pf.turnToPage(i);
      updateUi();
      scheduleRender();
    }

    function setupControls() {
      const slider = document.getElementById('slider');
      slider.max = pdf.numPages;
      if (RTL) { slider.dir = 'rtl'; slider.style.setProperty('--fill-dir', '270deg'); }
      slider.addEventListener('input', () => {
        setSlider(Number(slider.value));
        document.getElementById('pageLabel').innerHTML = slider.value + ' <small>/ ' + pdf.numPages + '</small>';
      });
      slider.addEventListener('change', () => goToOriginal(Number(slider.value)));

      // 左右のボタン・キーは「見た目の向き」で動かす（右開きでも左ボタン＝左側へ）
      document.getElementById('leftBtn').addEventListener('click', () => pf.flipPrev());
      document.getElementById('rightBtn').addEventListener('click', () => pf.flipNext());
      document.addEventListener('keydown', e => {
        if (!document.getElementById('zoom').hidden) { if (e.key === 'Escape') closeZoom(); return; }
        if (document.body.classList.contains('sheet-open')) { if (e.key === 'Escape') closeSheet(); return; }
        if (e.target.tagName === 'INPUT') return;
        if (e.key === 'ArrowLeft') pf.flipPrev();
        else if (e.key === 'ArrowRight') pf.flipNext();
        else if (e.key === 'Home') goToOriginal(1);
        else if (e.key === 'End') goToOriginal(pdf.numPages);
      });

      document.getElementById('thumbsBtn').addEventListener('click', openSheet);
      document.getElementById('sheetClose').addEventListener('click', closeSheet);
      document.getElementById('sheetBackdrop').addEventListener('click', closeSheet);
      document.getElementById('zoomBtn').addEventListener('click', openZoom);
      document.getElementById('zoomClose').addEventListener('click', closeZoom);
      document.getElementById('zoomIn').addEventListener('click', () => setZoom(zoomLevel + 1));
      document.getElementById('zoomOut').addEventListener('click', () => setZoom(zoomLevel - 1));
    }

    document.getElementById('shareBtn').addEventListener('click', async () => {
      const url = BOOT.execUrl + '?book=' + encodeURIComponent(META.id);
      toast(await copyText(url) ? 'URLをコピーしました' : url);
    });

    if (META.allowDownload) {
      const btn = document.getElementById('dlBtn');
      btn.hidden = false;
      btn.addEventListener('click', () => {
        if (!pdfBytes) return toast('読み込みが終わってから押してください');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([pdfBytes], { type: 'application/pdf' }));
        a.download = META.fileName || (META.title + '.pdf');
        document.body.appendChild(a);
        a.click();
        a.remove();
      });
    }

    if (document.fullscreenEnabled) {
      const btn = document.getElementById('fsBtn');
      btn.hidden = false;
      btn.addEventListener('click', () => {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen().catch(() => toast('全画面にできませんでした', true));
      });
    }

    // ───────── ページ一覧 ─────────

    let thumbsBuilt = false;
    const thumbQueue = [];
    let thumbBusy = false;

    function buildThumbs() {
      const box = document.getElementById('thumbs');
      if (RTL) box.dir = 'rtl';   // 右開きは1ページ目を右上に
      let html = '';
      for (let p = 1; p <= pdf.numPages; p++) {
        html += `<button class="thumb" data-p="${p}" aria-label="${p}ページへ"><div class="tc"></div><span class="n">${p}</span></button>`;
      }
      box.innerHTML = html;
      box.querySelectorAll('.tc').forEach(el => { el.style.aspectRatio = String(ratio); });
      const io = new IntersectionObserver(entries => {
        entries.forEach(en => {
          if (!en.isIntersecting) return;
          io.unobserve(en.target);
          thumbQueue.push(en.target);
          pumpThumbs();
        });
      }, { root: document.getElementById('sheetBody'), rootMargin: '300px 0px' });
      box.querySelectorAll('.thumb').forEach(t => io.observe(t));
      box.addEventListener('click', e => {
        const t = e.target.closest('.thumb');
        if (!t) return;
        goToOriginal(Number(t.dataset.p));
        if (window.innerWidth <= 560) closeSheet();
      });
      thumbsBuilt = true;
      updateUi();
    }

    async function pumpThumbs() {
      if (thumbBusy) return;
      thumbBusy = true;
      try {
        while (thumbQueue.length) {
          const t = thumbQueue.shift();
          const page = await pdf.getPage(Number(t.dataset.p));
          const vp1 = page.getViewport({ scale: 1 });
          const vp = page.getViewport({ scale: 140 * DPR / vp1.width });
          const c = document.createElement('canvas');
          c.width = Math.floor(vp.width);
          c.height = Math.floor(vp.height);
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, c.width, c.height);
          await page.render({ canvasContext: ctx, viewport: vp }).promise;
          t.querySelector('.tc').appendChild(c);
        }
      } finally {
        thumbBusy = false;
      }
    }

    function openSheet() {
      if (!thumbsBuilt) buildThumbs();
      document.body.classList.add('sheet-open');
      document.getElementById('sheet').setAttribute('aria-hidden', 'false');
      const cur = document.querySelector('.thumb.current');
      if (cur) cur.scrollIntoView({ block: 'center' });
    }

    function closeSheet() {
      document.body.classList.remove('sheet-open');
      document.getElementById('sheet').setAttribute('aria-hidden', 'true');
    }

    // ───────── 拡大表示 ─────────

    const ZOOMS = [1, 1.5, 2, 3];
    let zoomLevel = 0;
    let zoomBase = 0;   // 100% のときのページ幅(css px)

    async function openZoom() {
      const pages = visibleOriginalPages();
      if (!pages.length) return;
      const shown = RTL ? [...pages].reverse() : pages;   // 右開きは若いページが右側
      const zoom = document.getElementById('zoom');
      zoom.hidden = false;
      const body = document.getElementById('zoomBody');
      zoomBase = Math.min((body.clientWidth - 32) / shown.length, (body.clientHeight - 40) * ratio);
      zoomLevel = 0;
      const box = document.getElementById('zoomPages');
      box.innerHTML = '';
      const pxW = Math.min(3000, Math.round(zoomBase * ZOOMS[ZOOMS.length - 1] * DPR));
      for (const p of shown) {
        const canvas = document.createElement('canvas');
        canvas.dataset.page = p;
        box.appendChild(canvas);
      }
      applyZoom();
      for (const canvas of box.querySelectorAll('canvas')) {
        const page = await pdf.getPage(Number(canvas.dataset.page));
        const vp1 = page.getViewport({ scale: 1 });
        const vp = page.getViewport({ scale: pxW / vp1.width });
        canvas.width = Math.floor(vp.width);
        canvas.height = Math.floor(vp.height);
        applyZoom();
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
        if (zoom.hidden) return;
      }
    }

    function applyZoom() {
      const w = zoomBase * ZOOMS[zoomLevel];
      document.querySelectorAll('#zoomPages canvas').forEach(c => {
        c.style.width = w + 'px';
        c.style.height = (c.width ? w * c.height / c.width : w / ratio) + 'px';
      });
      document.getElementById('zoomLevel').textContent = Math.round(ZOOMS[zoomLevel] * 100) + '%';
      document.getElementById('zoomOut').disabled = zoomLevel === 0;
      document.getElementById('zoomIn').disabled = zoomLevel === ZOOMS.length - 1;
    }

    function setZoom(level) {
      const body = document.getElementById('zoomBody');
      const before = ZOOMS[zoomLevel];
      zoomLevel = Math.max(0, Math.min(ZOOMS.length - 1, level));
      const k = ZOOMS[zoomLevel] / before;   // 画面中央を基準に拡大縮小する
      const cx = body.scrollLeft + body.clientWidth / 2;
      const cy = body.scrollTop + body.clientHeight / 2;
      applyZoom();
      body.scrollLeft = cx * k - body.clientWidth / 2;
      body.scrollTop = cy * k - body.clientHeight / 2;
    }

    function closeZoom() {
      document.getElementById('zoom').hidden = true;
      document.querySelectorAll('#zoomPages canvas').forEach(c => { c.width = 0; c.height = 0; });
      document.getElementById('zoomPages').innerHTML = '';
    }

    // ───────── 起動 ─────────

    async function start() {
      const [lib, bytes] = await Promise.all([loadPdfjs(), fetchPdf()]);
      if (META.allowDownload) pdfBytes = bytes.slice();  // pdf.js に渡すと中身がワーカーへ移されるため複製を残す
      document.getElementById('loadText').textContent = 'Preparing';
      pdf = await lib.getDocument({ data: bytes, ...PDF_OPTS }).promise;

      const first = await pdf.getPage(1);
      const vp = first.getViewport({ scale: 1 });
      ratio = vp.width / vp.height;

      order = buildOrder(pdf.numPages);
      const m = order.length;
      const bookEl = document.getElementById('book');
      pageEls = order.map((p, i) => {
        const d = document.createElement('div');
        // 見開きで左に来るのは奇数index、右は偶数index（両端の単独ページはノドの陰なし）
        const single = i === 0 || (i === m - 1 && m % 2 === 0);
        d.className = 'pg' + (p ? '' : ' blank') + (single ? '' : i % 2 === 1 ? ' left' : ' right');
        bookEl.appendChild(d);
        return d;
      });

      fitBook();
      const startIdx = startIndex();
      pf = new St.PageFlip(bookEl, {
        width: Math.round(1000 * ratio),
        height: 1000,
        size: 'stretch',
        minWidth: MIN_PAGE_W,
        maxWidth: 4000,
        minHeight: 100,
        maxHeight: 6000,
        showCover: true,
        usePortrait: true,
        autoSize: true,
        mobileScrollSupport: false,
        maxShadowOpacity: 0.4,
        flippingTime: 800,
        startPage: startIdx,
      });
      pf.loadFromHTML(pageEls);
      fitBook();   // loadFromHTML の中で root の幅が 100% に書き換えられるので掛け直す
      pf.update();
      pf.on('flip', () => { updateUi(); scheduleRender(); });
      pf.on('changeOrientation', () => { updateUi(); scheduleRender(); });
      window.addEventListener('resize', () => { fitBook(); pf.update(); scheduleRender(); });

      setupControls();
      updateUi();
      // 最初の見開きを描き終えてから見せる
      for (const i of visibleIndexes()) if (order[i] > 0) await renderPage(i, targetWidth());
      await reveal(startIdx);
      scheduleRender();

      // 本棚から開いたときは、表紙をめくって中身を見せる
      const openOnArrival = BOOT.fromShelf && !reducedMotion && pf.getOrientation() === 'landscape' && order[startIdx] === 1 && pdf.numPages > 2;
      if (openOnArrival) setTimeout(() => (RTL ? pf.flipPrev() : pf.flipNext()), 450);
      else if (pdf.numPages > 1) toast(RTL ? '右開きです。ページの端をクリック・スワイプでめくれます' : 'ページの端をクリック・スワイプでめくれます');
    }

    /** 読み込み中の表紙を、本の表紙の位置へ滑らせて重ね、入れ替える */
    async function reveal(startIdx) {
      const loading = document.getElementById('loading');
      const bookEl = document.getElementById('book');
      document.getElementById('loadInfo').style.opacity = '0';
      const target = pageEls[startIdx].getBoundingClientRect();
      if (loadCover && loadCover.naturalWidth && order[startIdx] === 1 && target.width && !reducedMotion) {
        const from = loadCover.getBoundingClientRect();
        const s = target.width / from.width;
        await loadCover.animate([
          { transform: 'none' },
          { transform: `translate(${target.left - from.left}px, ${target.top - from.top}px) scale(${s})` },
        ], { duration: 650, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'forwards' }).finished;
      }
      bookEl.classList.add('shown');
      document.getElementById('controls').classList.remove('pending');
      await new Promise(r => setTimeout(r, 380));
      loading.style.transition = 'opacity .35s';
      loading.style.opacity = '0';
      setTimeout(() => loading.remove(), 400);
    }

    /** URLの &p=12 で開始ページを指定できる。なければ表紙 */
    function startIndex() {
      const p = Math.min(Math.max(1, Number(BOOT.startPage) || 1), pdf.numPages);
      return Math.max(0, indexOfOriginal(p));
    }

    start().catch(err => {
      console.error(err);
      const box = document.getElementById('loading');
      if (!box || !box.isConnected) return toast('表示中にエラーが起きました：' + err.message, true);
      box.innerHTML = '';
      const wrap = document.createElement('div');
      wrap.className = 'loadError';
      const msg = document.createElement('div');
      msg.textContent = '読み込めませんでした：' + err.message;
      const retry = document.createElement('button');
      retry.className = 'btn';
      retry.textContent = 'もう一度読み込む';
      retry.onclick = () => location.reload();
      wrap.append(msg, retry);
      box.appendChild(wrap);
    });
  </script>
</body>
</html>
